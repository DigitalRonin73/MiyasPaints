<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pinto Beetle | Under Maintenance</title>
  <meta name="description" content="Pinto Beetle is currently under maintenance. Please check back soon.">
  <meta name="theme-color" content="#3a253e">
  <link rel="icon" type="image/png" href="images/pinto-beetle-logo-round.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #3a253e;
      --paper: #fffaf7;
      --pink: #e94f97;
      --coral: #f06a35;
      --gold: #f7c94c;
      --teal: #6ac7c2;
      --blue: #168ccc;
      --green: #6aa63f;
      --purple: #9b63c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgb(233 79 151 / 14%), transparent 28rem),
        radial-gradient(circle at 85% 85%, rgb(106 199 194 / 20%), transparent 30rem),
        var(--paper);
      font-family: "Poppins", sans-serif;
    }

    main {
      width: min(90%, 46rem);
      padding: 3rem 2rem;
      text-align: center;
    }

    img {
      width: min(11rem, 42vw);
      height: auto;
    }

    h1 {
      margin: 1.25rem 0 0.75rem;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      line-height: 0.95;
    }

    p {
      max-width: 34rem;
      margin: 0 auto;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.7;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      max-width: 25rem;
      height: 0.5rem;
      margin: 2rem auto 0;
      overflow: hidden;
      border-radius: 999px;
    }

    .swatches span:nth-child(1) { background: var(--pink); }
    .swatches span:nth-child(2) { background: var(--coral); }
    .swatches span:nth-child(3) { background: var(--gold); }
    .swatches span:nth-child(4) { background: var(--teal); }
    .swatches span:nth-child(5) { background: var(--blue); }
    .swatches span:nth-child(6) { background: var(--green); }
    .swatches span:nth-child(7) { background: var(--purple); }
  </style>
</head>
<body>
  <main>
    <img src="images/pinto-beetle-logo-round.png" alt="Pinto Beetle">
    <h1>We&rsquo;re under maintenance</h1>
    <p>We&rsquo;re making a few thoughtful updates behind the scenes. Please check back soon.</p>
    <div class="swatches" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</body>
</html>
